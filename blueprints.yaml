name: Basalt Child
slug: basalt-child
type: theme
version: 0.2.0
description: A clean starter child theme for the Grav Basalt theme
icon: rebel
author:
  name: Norbert Morajda
  email: n.morajda@abmstudio.pl
homepage: https://github.com/nmorajda/grav-theme-basalt-child
keywords: grav, theme, child-theme, basalt, bootstrap, scss
bugs: https://github.com/nmorajda/grav-theme-basalt-child/issues
readme: https://github.com/nmorajda/grav-theme-basalt-child/blob/master/README.md
license: MIT

compatibility:
  grav: ['2.0']

dependencies:
  - { name: grav, version: '>=2.0.0' }
  - { name: basalt, version: '>=0.5.0' }

form:
  validation: loose

  fields:
    assets.css_mode:
      type: select
      label: CSS mode
      help: Choose additive parent and child CSS or the child-compiled CSS.
      default: additive
      options:
        additive: Additive
        compiled: Compiled

    dropdown.enabled:
      type: toggle
      label: Enable dropdown navigation
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    icons.enabled:
      type: toggle
      label: Enable Bootstrap Icons
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
